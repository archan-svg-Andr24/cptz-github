[pytest]
# Прил. В: тесты запускаются одной командой из корня проекта.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    error::DeprecationWarning:student_planner.*
# Интерфейсные тесты сами выставляют QT_QPA_PLATFORM=offscreen до импорта
# PySide6 (см. tests/test_ui.py), поэтому плагин pytest-env не нужен.
